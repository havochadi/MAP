services:
  - type: web
    name: map-coach-portal
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    # Postgres (Supabase) is persistent, so boot only applies pending
    # migrations — it never seeds or wipes data. Seed once after the first
    # deploy (e.g. `npm run db:seed` locally against the Supabase URLs, or
    # via Render's Shell tab), not on every boot like the old SQLite setup.
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      # Both URLs come from the Supabase dashboard: Project Settings ->
      # Database -> Connect -> Prisma tab. sync: false means Render won't
      # store a value here — set the real ones in the dashboard once, under
      # this service's Environment tab. Both must include sslmode=require
      # (Supabase's pooler cert chains to its own private CA, which isn't in
      # the public trust store) or Prisma fails with a misleading P1001
      # "can't reach database server".
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NODE_ENV
        value: production
